<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DRAGON PRYG</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dragon Pryg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#07080b; --panel:#11121a; --panel2:#171724; --panel3:#1d1b2b;
    --line:rgba(120,92,210,.30); --line2:rgba(255,170,42,.55);
    --text:#f7f4ff; --sub:#a99fca; --accent:#39dfff;
    --neon:#ff9d1c; --neon2:#ffe45d; --gold:#ffd54a;
    --danger:#ff5470; --good:#55e58b; --radius:22px; --radius-sm:14px;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:#06070a;color:var(--text);overflow-x:hidden}
  body{
    display:flex;justify-content:center;
    background:
      radial-gradient(circle at 50% 12%,rgba(110,70,170,.10),transparent 30%),
      linear-gradient(180deg,#07080c 0%,#090a0f 55%,#050609 100%);
  }
  #app{width:min(980px,100%);padding:14px 18px 28px;display:flex;flex-direction:column;gap:12px}
  #app.playing #menu-area{display:none}
  #app.playing #game-logo{display:none}
  #app.playing #stage{margin-top:4px}
  @media(max-width:700px){#app{padding:8px 8px 20px;gap:8px}}
  @media(max-width:430px){#app{padding:6px 6px 16px;gap:7px}}

  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    min-height:74px;padding:7px 10px 7px 7px;border-radius:34px;
    background:linear-gradient(180deg,rgba(20,20,32,.94),rgba(13,14,23,.94));
    border:1px solid rgba(105,79,191,.40);
    box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 12px 35px rgba(0,0,0,.32);
  }
  #tb-left{display:flex;align-items:center;gap:12px;min-width:0}
  #avatar{
    width:60px;height:60px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:29px;background:radial-gradient(circle at 40% 35%,#ffe987 0 13%,#ffad22 33%,#e44b17 68%,#34171c 100%);
    border:2px solid #ff9e22;box-shadow:0 0 0 3px rgba(255,161,35,.08),0 0 20px rgba(255,145,20,.45);
  }
  #tb-names{display:flex;flex-direction:column;gap:3px;line-height:1.05;min-width:0}
  #tb-nick{font-size:25px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  #tb-balance{font-size:22px;font-weight:800;color:#ddd7f6;white-space:nowrap}#tb-balance::before{content:'💎 ';color:#35dfff;filter:drop-shadow(0 0 5px rgba(53,223,255,.5))}
  #tb-balance::first-letter{color:#36ddff}
  #top-actions{display:flex;gap:10px}
  .top-action{width:58px;height:58px;border-radius:20px;border:1px solid rgba(108,84,185,.55);background:linear-gradient(180deg,#1c1b2c,#11111b);color:#ffb31f;font-size:29px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 22px rgba(0,0,0,.24);transition:.15s}
  .top-action:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(255,164,25,.18)}
  .top-action:active{transform:scale(.94)}

  /* ---------- logo ---------- */
  #game-logo{text-align:center;position:relative;padding:4px 0 0;user-select:none}
  #game-logo .diamond-logo{font-size:34px;filter:drop-shadow(0 0 9px #39dfff);line-height:.8}
  #game-logo .logo-text{display:inline-block;margin-top:3px;padding:4px 22px 7px;font-family:monospace;font-weight:1000;font-size:clamp(38px,7vw,72px);letter-spacing:-4px;line-height:.92;color:#ffe34f;-webkit-text-stroke:2px #ff7a16;text-shadow:4px 5px 0 #a62d12,0 0 8px #ff8e1b,0 0 22px rgba(255,126,20,.58);transform:skew(-3deg)}
  #game-logo .logo-sub{font:800 10px monospace;letter-spacing:4px;color:#a79bc9;margin-top:4px}

  /* ---------- game wrapper ---------- */
  #stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:24px;overflow:hidden;border:1px solid rgba(105,79,191,.38);background:#05060a;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 35px rgba(80,50,140,.08);touch-action:none;user-select:none}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
  @media(max-width:700px){#stage{border-radius:16px}}
  @media(max-width:430px){#stage{border-radius:13px}}

  /* ---------- in-game HUD ---------- */
  #hud{
    position:absolute; top:10px; left:10px; right:10px; z-index:5;
    display:flex; justify-content:space-between; gap:8px;
    pointer-events:none; opacity:0; transition:opacity .2s ease;
  }
  #hud.show{ opacity:1; }
  .pill{
    background:rgba(8,10,18,0.78); backdrop-filter:blur(10px); box-shadow:0 5px 18px rgba(0,0,0,0.28);
    border:1px solid rgba(255,255,255,0.1); border-radius:999px;
    padding:6px 12px; font-size:12px; font-weight:600; color:var(--text);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .pill b{ color:var(--gold); font-weight:800; }
  .pill.time b{ color:var(--accent); }

  /* ---------- menu / controls ---------- */
  .overlay.hidden{display:none}  #menu-area{display:flex;flex-direction:column;gap:12px}
  #menu-overlay{position:static;inset:auto;padding:0;background:none;backdrop-filter:none;display:block;overflow:visible}
  #menu-overlay .card{width:100%;max-width:none;background:none;border:none;border-radius:0;padding:0;box-shadow:none;display:flex;flex-direction:column;gap:12px}
  #menu-overlay .title{display:none}
  .balance-row{display:none}.best-row{display:none}
  .section-label{font-family:monospace;font-size:16px;font-weight:900;letter-spacing:2px;color:#e9e2ff;text-align:center;margin:0 0 7px;text-transform:uppercase}
  .bet-card,.duration-card{background:linear-gradient(180deg,rgba(18,18,29,.98),rgba(17,16,27,.98));border:1px solid rgba(105,79,191,.48);border-radius:22px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.025)}
  .bet-controls{display:flex;align-items:center;justify-content:center;gap:22px}
  .bet-btn{width:72px;height:58px;border-radius:17px;border:1px solid rgba(255,167,31,.85);background:linear-gradient(180deg,#ffb526,#ff8b13);color:#281100;font-size:34px;font-weight:1000;cursor:pointer;box-shadow:0 0 18px rgba(255,142,17,.22),inset 0 2px 0 rgba(255,255,255,.3);transition:.13s}
  .bet-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}.bet-btn:active{transform:scale(.92)}
  .bet-value{font-family:monospace;font-size:32px;font-weight:1000;color:#fff6b0;min-width:205px;text-align:center;text-shadow:0 0 12px rgba(255,204,72,.16)}
  .bet-hint{text-align:center;font-size:13px;color:#a59bc4;margin-top:8px}
  .dur-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
  .dur-chip{padding:13px 0;text-align:center;border-radius:13px;border:1px solid rgba(105,79,191,.45);background:linear-gradient(180deg,#1b1a2a,#141421);color:#d8d2ee;font-family:monospace;font-size:17px;font-weight:900;cursor:pointer;transition:.15s}
  .dur-chip:hover{border-color:rgba(255,170,36,.5)}
  .dur-chip.active{background:linear-gradient(180deg,#6b430f,#2a1b0d);border-color:#ffd22e;color:#fff0a2;box-shadow:0 0 18px rgba(255,185,35,.24),inset 0 0 12px rgba(255,160,0,.08)}
  .dur-chip:active{transform:scale(.94)}
  .btn{border:none;border-radius:18px;padding:20px;font-family:monospace;font-size:30px;font-weight:1000;letter-spacing:1px;cursor:pointer;color:#2b1200;background:linear-gradient(115deg,#ff8410 0%,#ff9e1b 28%,#ffe45b 53%,#ff9a16 78%,#ff7510 100%);background-size:220% 220%;box-shadow:0 13px 32px rgba(255,126,12,.26),0 0 0 2px rgba(255,179,33,.22),inset 0 2px 0 rgba(255,255,255,.42);transition:transform .13s,filter .13s,box-shadow .13s;animation:btnShimmer 4s ease-in-out infinite}
  .btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 16px 36px rgba(255,126,12,.34),0 0 22px rgba(255,167,28,.16),inset 0 2px 0 rgba(255,255,255,.44)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;filter:grayscale(.5);box-shadow:none;cursor:not-allowed}
  .btn.secondary{background:linear-gradient(180deg,#1c1b2c,#141421);color:#f2edff;border:1px solid rgba(105,79,191,.55);box-shadow:0 8px 22px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04);font-family:monospace;font-size:20px;padding:17px}
  .btn.secondary:hover{border-color:rgba(255,160,28,.55);color:#ffe6a1}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @keyframes btnShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  #result-overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,rgba(5,6,10,.55),rgba(5,6,10,.88));backdrop-filter:blur(6px)}
  #result-overlay.hidden{display:none}
  #result-overlay .card{width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:16px}
  .result-title{text-align:center;font-size:26px;font-weight:900;letter-spacing:1px}.result-title.lose{color:var(--danger);text-shadow:0 0 18px rgba(255,84,112,.5)}.result-title.win{color:var(--gold);text-shadow:0 0 18px rgba(255,213,74,.55)}
  .result-sub{text-align:center;color:var(--sub);font-size:13px;margin-top:-8px}
  .stat-list{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border-radius:14px;padding:14px;border:1px solid var(--line)}
  .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}.stat b{color:var(--text);font-weight:700}.stat.neg b{color:var(--danger)}.stat.pos b{color:var(--good)}.stat.muted{opacity:.6;font-size:11.5px}
  @media(max-width:700px){
    #topbar{min-height:58px;border-radius:25px}.top-action{width:46px;height:46px;border-radius:15px;font-size:23px}.top-action:nth-child(2){display:none}
    #avatar{width:46px;height:46px;font-size:22px}#tb-nick{font-size:20px}#tb-balance{font-size:16px}
    .bet-card,.duration-card{padding:12px;border-radius:17px}.bet-btn{width:54px;height:48px;font-size:28px}.bet-value{font-size:25px;min-width:145px}.bet-controls{gap:10px}.bet-hint{font-size:11px}
    .section-label{font-size:12px}.dur-grid{grid-template-columns:repeat(4,1fr);gap:6px}.dur-chip{padding:10px 0;font-size:14px}
    .btn{font-size:24px;padding:16px}.btn.secondary{font-size:15px;padding:14px}.row2{gap:8px}
    #game-logo .logo-text{font-size:clamp(32px,10vw,52px);letter-spacing:-3px}.logo-sub{font-size:8px}
  }
  @media(max-width:380px){#tb-balance{font-size:14px}.bet-value{font-size:22px;min-width:120px}.bet-btn{width:48px;height:44px}.btn{font-size:21px}.btn.secondary{font-size:14px}}

  .result-title{ text-align:center; font-size:24px; font-weight:800; letter-spacing:1px; }
  .result-title.lose{ color:var(--danger); text-shadow:0 0 18px rgba(255,84,112,0.5); }
  .result-title.win{ color:var(--gold); text-shadow:0 0 18px rgba(255,213,74,0.55); }
  .result-sub{ text-align:center; color:var(--sub); font-size:13px; margin-top:-8px; }
  .stat-list{ display:flex; flex-direction:column; gap:8px; background:var(--panel2); border-radius:14px; padding:14px; border:1px solid var(--line);}
  .stat{ display:flex; justify-content:space-between; font-size:13px; color:var(--sub); }
  .stat b{ color:var(--text); font-weight:700; }
  .stat.neg b{ color:var(--danger); }
  .stat.pos b{ color:var(--good); }
  .stat.muted{ opacity:0.6; font-size:11.5px; }

  /* modal */
  .modal-overlay{ position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(5,6,10,0.7); backdrop-filter:blur(6px); }
  .modal-overlay.hidden{ display:none; }
  .modal{ width:100%; max-width:320px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; text-align:center; display:flex; flex-direction:column; gap:14px; }
  .modal h3{ margin:0; font-size:17px; font-weight:800; }
  .modal p{ margin:0; font-size:13px; color:var(--sub); line-height:1.5; }

  #tap-hint{
    position:absolute; bottom:14px; left:0; right:0; text-align:center; z-index:4;
    font-size:11px; color:rgba(255,255,255,0.55); letter-spacing:0.5px; pointer-events:none;
    opacity:0; transition:opacity .3s ease;
  }
  #tap-hint.show{ opacity:1; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>

<style id="reference-final-fix">
/* Final reference matching: chunky arcade/pixel presentation */
#game-logo{padding:12px 0 7px;position:relative;overflow:visible}
#game-logo .diamond-logo{font-size:50px;line-height:.62;position:relative;z-index:5;color:#25dcff;text-shadow:0 0 0 #0b7fa7,0 0 10px #22dfff,0 0 24px rgba(34,223,255,.7)}
#game-logo .logo-text{position:relative;z-index:2;margin-top:7px;padding:15px 42px 18px;font-family:monospace;font-weight:1000;font-size:clamp(50px,7vw,82px);letter-spacing:-6px;line-height:.82;color:#ffe04b;-webkit-text-stroke:3px #ff7b12;text-shadow:5px 6px 0 #9f2d12,0 0 7px #ff8c16,0 0 22px rgba(255,123,18,.75);transform:skew(-3deg);background:transparent;clip-path:none}
#game-logo .logo-text:before{content:"";position:absolute;z-index:-2;inset:0 -8px -3px;background:#ff8b16;clip-path:polygon(5% 0,35% 0,39% 5%,64% 5%,68% 0,95% 0,100% 24%,97% 48%,100% 82%,95% 100%,70% 100%,66% 96%,34% 96%,30% 100%,5% 100%,0 78%,3% 48%,0 22%);filter:drop-shadow(0 0 9px rgba(255,128,15,.72))}
#game-logo .logo-text:after{content:"";position:absolute;z-index:-1;inset:3px 0 0;background:#17111b;clip-path:polygon(5% 0,35% 0,39% 5%,64% 5%,68% 0,95% 0,100% 24%,97% 48%,100% 82%,95% 100%,70% 100%,66% 96%,34% 96%,30% 100%,5% 100%,0 78%,3% 48%,0 22%)}
#game-logo .logo-sub{font-size:10px;letter-spacing:4px;color:#9d91bf;margin-top:8px}
#stage{aspect-ratio:16/9;border-radius:24px;border:2px solid #2d2445;background:#050509;box-shadow:0 25px 65px rgba(0,0,0,.68),0 0 34px rgba(84,55,135,.12);overflow:hidden}
/* readable reference-style billboards */
@media(min-width:701px){
  #game-logo .logo-text{font-size:clamp(56px,6.9vw,82px)}
  #stage{min-height:0}
}
@media(max-width:700px){
  #game-logo{padding:7px 0 4px}
  #game-logo .diamond-logo{font-size:34px}
  #game-logo .logo-text{font-size:clamp(34px,10.8vw,54px);letter-spacing:-3px;padding:11px 18px 13px;-webkit-text-stroke:2px #ff7b12;text-shadow:3px 4px 0 #9f2d12,0 0 6px #ff8c16,0 0 15px rgba(255,123,18,.65)}
  #game-logo .logo-sub{font-size:7px;letter-spacing:2.5px;margin-top:5px}
  #stage{width:100%!important;height:auto!important;aspect-ratio:16/9;min-height:0;border-radius:18px}
}
@media(max-width:390px){
  #game-logo .logo-text{font-size:clamp(31px,10.5vw,46px);padding-left:13px;padding-right:13px}
  #game-logo .logo-sub{display:none}
}
@media(orientation:landscape) and (max-height:600px){
  #game-logo .logo-text{font-size:clamp(34px,6vw,58px);padding:7px 20px 9px}
  #game-logo .diamond-logo{font-size:28px}
}

<body>
<div id="app">

  <div id="topbar">
    <div id="tb-left">
      <div id="avatar">🐲</div>
      <div id="tb-names">
        <div id="tb-nick">Ronaldo</div>
        <div id="tb-balance">💎 100.00 GRAM</div>
      </div>
    </div>
    <div id="top-actions">
      <button class="top-action" id="sound-btn" aria-label="Звук">🔊</button>
      <button class="top-action" id="settings-btn" aria-label="Настройки">⚙️</button>
    </div>
  </div>

  <div id="game-logo">
    <div class="diamond-logo">◆</div>
    <div class="logo-text">DRAGON PRYG</div>
    <div class="logo-sub">ЗОЛОТОЙ ЗАБЕГ • DRAGON MONEY</div>
  </div>

  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>

    <div id="hud">
      <div class="pill bet">Ставка: <b id="hud-bet">1.00</b></div>
      <div class="pill">💎 <b id="hud-diamonds">0</b></div>
      <div class="pill time">Время: <b id="hud-time">10</b> сек</div>
    </div>

    <div id="tap-hint">SPACE / ↑ / ТАП — ПРЫЖОК</div>

    <!-- RESULT -->
    <div id="result-overlay" class="overlay hidden">
      <div class="card" id="result-card"></div>
    </div>

    <!-- MODAL -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <h3 id="modal-title"></h3>
        <p id="modal-text"></p>
        <button class="btn secondary" id="modal-close">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="menu-area">    <!-- MENU -->
    <div id="menu-overlay" class="overlay">
      <div class="card">
        <div class="title">DRAGON PRYG<small>ЗОЛОТОЙ ЗАБЕГ</small></div>
        <div class="balance-row">Баланс: <b id="menu-balance">100.00</b> GRAM</div>
        <div class="best-row">Лучший результат за забег: <span id="menu-best">0.00</span> GRAM</div>

        <div>
          <div class="section-label">СТАВКА</div>
          <div class="bet-card">
            <div class="bet-controls">
              <button class="bet-btn" id="bet-minus">−</button>
              <div class="bet-value" id="bet-value">1.00 GRAM</div>
              <button class="bet-btn" id="bet-plus">+</button>
            </div>
            <div class="bet-hint">Минимум 0.1 GRAM · не больше баланса</div>
          </div>
        </div>

        <div>
          <div class="section-label">ДЛИТЕЛЬНОСТЬ ЗАБЕГА</div>
          <div class="dur-grid" id="dur-grid"></div>
        </div>

        <button class="btn" id="play-btn">ИГРАТЬ</button>
        <div class="row2">
          <button class="btn secondary" id="deposit-btn">ВВОД</button>
          <button class="btn secondary" id="withdraw-btn">ВЫВОД</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG
============================================================ */
const CFG = {
  W: 480, H: 270,
  groundY: 216,
  gravity: 2500,
  jumpV: -840,
  playerX: 118,
  playerW: 44,
  playerH: 88,
};
const DURATIONS = [10,15,20,25,30,35,40,45];
const SAVE_KEY = 'dragonPrygSave_v1';

/* ============================================================
   SAVE / STATE
============================================================ */
function round2(n){ return Math.round(n*100)/100; }

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      return {
        balance: typeof d.balance === 'number' && isFinite(d.balance) ? d.balance : 100,
        best: typeof d.best === 'number' && isFinite(d.best) ? d.best : 0,
        sound: d.sound !== false
      };
    }
  }catch(e){}
  return { balance:100, best:0, sound:true };
}
let save = loadSave();
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const ui = { bet: 1.0, duration: 20 };

/* ============================================================
   DOM REFS
============================================================ */
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const el = {
  tbBalance: $('tb-balance'), soundBtn: $('sound-btn'),
  hud: $('hud'), hudBet: $('hud-bet'), hudTime: $('hud-time'), hudDiamonds: $('hud-diamonds'),
  tapHint: $('tap-hint'),
  menuOverlay: $('menu-overlay'), menuBalance: $('menu-balance'), menuBest: $('menu-best'),
  betValue: $('bet-value'), betMinus: $('bet-minus'), betPlus: $('bet-plus'),
  durGrid: $('dur-grid'), playBtn: $('play-btn'),
  depositBtn: $('deposit-btn'), withdrawBtn: $('withdraw-btn'), settingsBtn: $('settings-btn'),
  resultOverlay: $('result-overlay'), resultCard: $('result-card'),
  modalOverlay: $('modal-overlay'), modalTitle: $('modal-title'), modalText: $('modal-text'), modalClose: $('modal-close'),
};

/* ============================================================
   AUDIO
============================================================ */
let actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(actx && actx.state === 'suspended'){ actx.resume(); }
}
function beep(freq, dur, type, delay, vol){
  if(!actx) return;
  const t0 = actx.currentTime + (delay||0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.16, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.start(t0); o.stop(t0+dur+0.03);
}
function playSound(name){
  if(!save.sound) return;
  ensureAudio();
  if(!actx) return;
  if(name==='jump') beep(560,0.11,'square');
  else if(name==='coin'){ beep(920,0.09,'triangle'); beep(1300,0.07,'triangle',0.05); }
  else if(name==='hit') beep(110,0.4,'sawtooth');
  else if(name==='lose') beep(160,0.5,'sawtooth');
  else if(name==='click') beep(740,0.05,'square');
  else if(name==='win'){
    [660,880,990,1320].forEach((f,i)=>beep(f,0.16,'square',i*0.09));
  }
}

/* ============================================================
   UI: TOPBAR / MENU
============================================================ */
function refreshBalanceUI(){
  el.tbBalance.textContent = save.balance.toFixed(2) + ' GRAM';
  el.menuBalance.textContent = save.balance.toFixed(2);
  el.menuBest.textContent = save.best.toFixed(2);
  el.soundBtn.textContent = save.sound ? '🔊' : '🔇';
  refreshBetUI();
}
function clampBet(){
  const maxBet = Math.max(0, save.balance);
  if(ui.bet > maxBet) ui.bet = Math.floor(maxBet*10)/10;
  if(ui.bet < 0.1) ui.bet = 0.1;
  ui.bet = round2(ui.bet);
}
function refreshBetUI(){
  clampBet();
  el.betValue.textContent = ui.bet.toFixed(2) + ' GRAM';
  const canPlay = save.balance >= 0.1 - 1e-9 && save.balance >= ui.bet - 1e-9;
  el.playBtn.disabled = !canPlay;
  el.betMinus.disabled = ui.bet <= 0.1 + 1e-9;
  el.betPlus.disabled = ui.bet >= save.balance - 1e-9;
}
el.betMinus.addEventListener('click', ()=>{
  playSound('click');
  ui.bet = round2(Math.max(0.1, ui.bet - 0.1));
  refreshBetUI();
});
el.betPlus.addEventListener('click', ()=>{
  playSound('click');
  ui.bet = round2(Math.min(save.balance, ui.bet + 0.1));
  refreshBetUI();
});

function buildDurationChips(){
  el.durGrid.innerHTML = '';
  DURATIONS.forEach(d=>{
    const chip = document.createElement('div');
    chip.className = 'dur-chip' + (d===ui.duration ? ' active' : '');
    chip.textContent = d + 'с';
    chip.addEventListener('click', ()=>{
      playSound('click');
      ui.duration = d;
      buildDurationChips();
    });
    el.durGrid.appendChild(chip);
  });
}
buildDurationChips();

el.soundBtn.addEventListener('click', ()=>{
  ensureAudio();
  save.sound = !save.sound;
  persist();
  el.soundBtn.textContent = save.sound ? '🔊' : '🔇';
  if(save.sound) playSound('click');
});

function openModal(type){
  playSound('click');
  if(type==='deposit'){
    el.modalTitle.textContent = 'Ввод GRAM';
    el.modalText.textContent = 'В демонстрационной версии пополнение недоступно.';
  }else{
    el.modalTitle.textContent = 'Вывод GRAM';
    el.modalText.textContent = 'В демонстрационной версии вывод недоступен.';
  }
  el.modalOverlay.classList.remove('hidden');
}
el.depositBtn.addEventListener('click', ()=>openModal('deposit'));
el.withdrawBtn.addEventListener('click', ()=>openModal('withdraw'));
el.settingsBtn.addEventListener('click', ()=>{ playSound('click'); el.modalTitle.textContent='Настройки'; el.modalText.textContent='Здесь можно будет управлять звуком и настройками игры.'; el.modalOverlay.classList.remove('hidden'); });
el.modalClose.addEventListener('click', ()=>{ playSound('click'); el.modalOverlay.classList.add('hidden'); });

/* ============================================================
   ECONOMY FORMULAS
============================================================ */
function diamondValue(d){
  let v;
  if(d<=30) v = 0.10 + (d-10)*0.02;
  else v = 0.50 + (d-30)*((1.00-0.50)/15);
  return round2(v);
}
function difficultyFactor(d){ return (d-10)/(45-10); }
function baseSpeed(d){ return 230 + difficultyFactor(d)*300; }
function baseSpawnInterval(d){ return 1450 - difficultyFactor(d)*750; }

/* ============================================================
   GAME STATE
============================================================ */
let mode = 'menu'; // menu | playing | dying | winning | result
let run = null;
let player = { y:0, vy:0, grounded:true };
let bgScroll = 0;
let deathAnim = null;
let danceAnim = null;
let screenShake = { t:0, dur:0, mag:0 };
let idleT = 0;

function rand(a,b){ return a + Math.random()*(b-a); }

function playerRect(){
  // Hitbox follows the actual sprite silhouette and leaves a little transparent margin.
  return {
    x: CFG.playerX - 22,
    y: CFG.groundY - 69 + player.y,
    w: 43,
    h: 67
  };
}
function obstacleRect(o){
  if(o.kind==='ground') return { x:o.x, y: CFG.groundY - o.h, w:o.w, h:o.h };
  return { x:o.x, y: CFG.groundY + o.y, w:o.w, h:o.h };
}
function rectHit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function circleRectHit(rect, cx, cy, r){
  const nx = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
  const ny = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
  const dx = cx-nx, dy = cy-ny;
  return (dx*dx+dy*dy) <= r*r;
}

/* ---------------- start / bet flow ---------------- */
function startRun(){
  if(save.balance < ui.bet - 1e-9) return;
  ensureAudio();
  playSound('click');
  save.balance = round2(save.balance - ui.bet);
  persist();
  refreshBalanceUI();

  run = {
    bet: ui.bet,
    duration: ui.duration,
    elapsed: 0,
    diamonds: 0,
    dvalue: diamondValue(ui.duration),
    speed: baseSpeed(ui.duration),
    obstacles: [],
    diamondsArr: [],
    floaters: [],
    nextObstacleIn: rand(500,900),
    nextDiamondIn: rand(600,1200),
  };
  player = { y:0, vy:0, grounded:true };
  mode = 'playing';
  document.getElementById('app').classList.add('playing');
  el.menuOverlay.classList.add('hidden');
  el.resultOverlay.classList.add('hidden');
  el.hud.classList.add('show');
  el.tapHint.classList.add('show');
  el.hudBet.textContent = run.bet.toFixed(2);
  el.hudTime.textContent = run.duration;
  el.hudDiamonds.textContent = '0';
}
el.playBtn.addEventListener('click', startRun);

function resetToMenu(){
  mode = 'menu';
  document.getElementById('app').classList.remove('playing');
  run = null;
  el.hud.classList.remove('show');
  el.tapHint.classList.remove('show');
  el.resultOverlay.classList.add('hidden');
  el.menuOverlay.classList.remove('hidden');
  refreshBalanceUI();
  buildDurationChips();
}

/* ---------------- jump ---------------- */
function tryJump(){
  ensureAudio();
  if(mode==='playing' && player.grounded){
    player.vy = CFG.jumpV;
    player.grounded = false;
    playSound('jump');
  }
}
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space' || e.code==='ArrowUp'){
    e.preventDefault();
    tryJump();
  }
});
canvas.addEventListener('mousedown', tryJump);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); tryJump(); }, {passive:false});

/* ---------------- spawning ---------------- */
function spawnObstacle(){
  const types = ['barrel','spike','crate','rock'];
  const type = types[Math.floor(Math.random()*types.length)];
  const dims = {
    barrel:{w:20,h:24}, spike:{w:16,h:16}, crate:{w:22,h:20}, rock:{w:22,h:16}
  }[type];
  run.obstacles.push({ type, x: CFG.W+10, y:0, w:dims.w, h:dims.h, kind:'ground' });

  const df = difficultyFactor(run.duration);
  if(Math.random() < 0.18 + df*0.32){
    run.obstacles.push({
      type:'bat', x: CFG.W + 40 + Math.random()*40,
      y: -(58 + Math.random()*26), w:22, h:14, kind:'air', flapT: Math.random()*10
    });
  }

  const airTime = 2*Math.abs(CFG.jumpV)/CFG.gravity;
  const minGapPx = Math.max(230, run.speed*airTime*0.85);
  const gapPx = minGapPx + Math.random()*minGapPx*0.55;
  const progress = Math.min(run.elapsed/(run.duration*1000), 1);
  run.nextObstacleIn = Math.max(520, (gapPx/run.speed)*1000) * (1 - progress*0.12);
}
function spawnDiamond(){
  const elevated = Math.random() < 0.42;
  const d = {
    x: CFG.W + 10 + Math.random()*50,
    y: elevated ? -(66+Math.random()*34) : -(26+Math.random()*6),
    r: 6, taken:false, phase: Math.random()*10
  };
  run.diamondsArr.push(d);
  const df = difficultyFactor(run.duration);
  run.nextDiamondIn = rand(1300,2500) - df*550;
}

/* ---------------- floaters ---------------- */
function addFloater(x,y,text,color){
  run.floaters.push({ x, y, text, alpha:1, vy:-32, color: color||'#ffd54a' });
}
function updateFloaters(dt){
  for(let i=run.floaters.length-1;i>=0;i--){
    const f = run.floaters[i];
    f.y += f.vy*dt/1000;
    f.alpha -= dt/900;
    if(f.alpha<=0) run.floaters.splice(i,1);
  }
}

/* ---------------- lose / win ---------------- */
function triggerLose(){
  mode = 'dying';
  playSound('hit');
  setTimeout(()=>playSound('lose'), 200);
  deathAnim = { t:0, dur:1100 };
  screenShake = { t:0, dur:320, mag:7 };
  el.hud.classList.remove('show');
  el.tapHint.classList.remove('show');
}
function finishLose(){
  const potential = round2(Math.min(run.diamonds*run.dvalue, 10));
  showResult('lose', { bet: run.bet, diamonds: run.diamonds, potential });
  mode = 'result';
}
function triggerWin(){
  mode = 'winning';
  playSound('win');
  danceAnim = { phase:'side', t:0 };
  el.hud.classList.remove('show');
  el.tapHint.classList.remove('show');
}
function finishWin(){
  const win = round2(Math.min(run.diamonds*run.dvalue, 10));
  save.balance = round2(save.balance + win);
  if(win > save.best) save.best = win;
  persist();
  refreshBalanceUI();
  showResult('win', { diamonds: run.diamonds, win, newBalance: save.balance });
  mode = 'result';
}

function showResult(type, data){
  el.resultCard.innerHTML = '';
  const title = document.createElement('div');
  const sub = document.createElement('div');
  sub.className = 'result-sub';
  const stats = document.createElement('div');
  stats.className = 'stat-list';
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = 'ЗАНОВО';
  btn.addEventListener('click', ()=>{ playSound('click'); resetToMenu(); });

  if(type==='lose'){
    title.className = 'result-title lose';
    title.textContent = 'ПОРАЖЕНИЕ';
    sub.textContent = 'Ставка сгорела';
    stats.innerHTML = `
      <div class="stat neg">Ставка<b>-${data.bet.toFixed(2)} GRAM</b></div>
      <div class="stat">Собрано алмазов<b>${data.diamonds}</b></div>
      <div class="stat">Потенциальный заработок<b>${data.potential.toFixed(2)} GRAM</b></div>
      <div class="stat muted">Не засчитано</div>
    `;
  }else{
    title.className = 'result-title win';
    title.textContent = 'ПОБЕДА!';
    sub.textContent = 'Забег завершён';
    stats.innerHTML = `
      <div class="stat">Алмазов собрано<b>${data.diamonds}</b></div>
      <div class="stat pos">Заработано<b>+${data.win.toFixed(2)} GRAM</b></div>
      <div class="stat">Новый баланс<b>${data.newBalance.toFixed(2)} GRAM</b></div>
    `;
  }
  el.resultCard.appendChild(title);
  el.resultCard.appendChild(sub);
  el.resultCard.appendChild(stats);
  el.resultCard.appendChild(btn);
  el.resultOverlay.classList.remove('hidden');
}

/* ============================================================
   UPDATE LOOP
============================================================ */
let lastTs = 0;
function loop(ts){
  if(!lastTs) lastTs = ts;
  let dt = ts - lastTs;
  lastTs = ts;
  if(dt > 60) dt = 60; // clamp huge jumps (tab switch)
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}

function update(dt){
  const dtS = dt/1000;
  idleT += dt;

  if(mode==='playing'){
    run.elapsed += dt;
    const progress = Math.min(run.elapsed/(run.duration*1000), 1);
    const speedMult = 1 + progress*0.65;
    run.speed = baseSpeed(run.duration)*speedMult;

    player.vy += CFG.gravity*dtS;
    player.y += player.vy*dtS;
    if(player.y > 0){ player.y = 0; player.vy = 0; player.grounded = true; }

    run.nextObstacleIn -= dt;
    if(run.nextObstacleIn <= 0) spawnObstacle();
    run.nextDiamondIn -= dt;
    if(run.nextDiamondIn <= 0) spawnDiamond();

    for(let i=run.obstacles.length-1;i>=0;i--){
      const o = run.obstacles[i];
      o.x -= run.speed*dtS;
      if(o.type==='bat') o.flapT += dt;
      if(o.x + o.w < -30){ run.obstacles.splice(i,1); continue; }
      if(rectHit(playerRect(), obstacleRect(o))){ triggerLose(); return; }
    }
    for(let i=run.diamondsArr.length-1;i>=0;i--){
      const d = run.diamondsArr[i];
      d.x -= run.speed*dtS;
      d.phase += dt/1000;
      if(d.x < -30){ run.diamondsArr.splice(i,1); continue; }
      const pr = playerRect();
      if(circleRectHit(pr, d.x, CFG.groundY + d.y, d.r)){
        run.diamondsArr.splice(i,1);
        run.diamonds++;
        addFloater(d.x, CFG.groundY + d.y, '+' + run.dvalue.toFixed(2) + ' GRAM', '#33e0ff');
        playSound('coin');
        el.hudDiamonds.textContent = run.diamonds;
      }
    }
    updateFloaters(dt);
    el.hudTime.textContent = Math.max(0, Math.ceil((run.duration*1000 - run.elapsed)/1000));

    if(run.elapsed >= run.duration*1000){ triggerWin(); return; }

  }else if(mode==='dying'){
    deathAnim.t += dt;
    updateFloaters(dt);
    for(const o of run.obstacles){ o.x -= (run.speed*0.15)*dtS; }
    if(screenShake.t < screenShake.dur) screenShake.t += dt;
    if(deathAnim.t >= deathAnim.dur) finishLose();

  }else if(mode==='winning'){
    updateFloaters(dt);
    danceAnim.t += dt;
    if(danceAnim.phase==='side' && danceAnim.t > 1900){
      danceAnim.phase='turn'; danceAnim.t=0;
    }else if(danceAnim.phase==='turn' && danceAnim.t > 450){
      danceAnim.phase='pose'; danceAnim.t=0;
    }else if(danceAnim.phase==='pose' && danceAnim.t > 1100){
      finishWin();
    }
  }

  bgScroll += (mode==='playing' ? run.speed : 36) * dtS;
}

const buildingPattern = (()=>{
  const arr=[]; let x=0;

    {w:52,h:96,sign:'left'}, {w:40,h:132}, {w:62,h:78}, {w:48,h:116,sign:'mid'},

  ];
  defs.forEach((d,i)=>{arr.push({x,w:d.w,h:d.h,sign:d.sign||'',i});x+=d.w+12+(i%3)*5});
  return {arr,width:x+40};
})();
function drawBuildingLayer(scroll,color,alpha,layer){
  ctx.save();ctx.globalAlpha=alpha;
  const patW=buildingPattern.width,off=((scroll%patW)+patW)%patW;
  for(let rep=-1;rep<=1;rep++){
    const shift=rep*patW-off;
    for(const b of buildingPattern.arr){
      const bx=b.x+shift;if(bx>CFG.W+30||bx+b.w<-30)continue;
      const by=CFG.groundY-b.h;
      ctx.fillStyle=color;ctx.fillRect(bx,by,b.w,b.h);
      ctx.fillStyle=layer===0?'#0e0d15':layer===1?'#12101a':'#15121e';ctx.fillRect(bx+4,by+5,b.w-8,b.h-5);
      // Roof accents.
      ctx.fillStyle='#0b0a10';ctx.fillRect(bx-2,by,b.w+4,4);
      if(b.i%3===0){ctx.fillRect(bx+b.w*.55,by-12,3,12);ctx.fillRect(bx+b.w*.48,by-15,17,3)}
      // Windows: purple + warm orange like the reference.
      for(let wy=by+13;wy<CFG.groundY-9;wy+=12){
        for(let wx=bx+8;wx<bx+b.w-7;wx+=12){
          const n=(Math.floor(wx*3+wy*5+b.i*17)%11);
          if(n<5){
            ctx.fillStyle=(n===0||n===3)?'#b26a2d':'#5a4a78';
            ctx.fillRect(wx,wy,4,5);
            if(n===0){ctx.fillStyle='rgba(255,177,55,.25)';ctx.fillRect(wx-1,wy-1,6,7)}
          }
        }
      }
      if(layer>0 && b.sign){
        const signW=Math.min(102,b.w+36), signH=38;
        const sx=bx+(b.w-signW)/2, sy=by+17;
        ctx.save();
        ctx.shadowColor='#ff8b17';ctx.shadowBlur=9;
        ctx.fillStyle='#211218';ctx.fillRect(sx,sy,signW,signH);
        ctx.shadowBlur=0;
        ctx.strokeStyle='#ff7f16';ctx.lineWidth=2;ctx.strokeRect(sx,sy,signW,signH);

        ctx.restore();

    }

  if(layer===2){

}

/* ---- obstacles ---- */
function drawObstacle(o){
  const r = obstacleRect(o);
  ctx.save();
  switch(o.type){
    case 'barrel':{
      ctx.fillStyle = '#5a3a22';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = '#3d2716';
      ctx.fillRect(r.x, r.y+4, r.w, 3);
      ctx.fillRect(r.x, r.y+r.h-7, r.w, 3);
      ctx.fillStyle = '#26160c';
      ctx.fillRect(r.x, r.y, r.w, 2);
      break;
    }
    case 'spike':{
      ctx.fillStyle = '#3a3f4d';
      for(let i=0;i<r.w;i+=8){
        ctx.beginPath();
        ctx.moveTo(r.x+i, r.y+r.h);
        ctx.lineTo(r.x+i+4, r.y);
        ctx.lineTo(r.x+i+8, r.y+r.h);
        ctx.closePath();
        ctx.fill();
      }
      break;
    }
    case 'crate':{
      ctx.fillStyle = '#4a3624';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = '#2a1c10';
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x+1, r.y+1, r.w-2, r.h-2);
      ctx.beginPath();
      ctx.moveTo(r.x, r.y); ctx.lineTo(r.x+r.w, r.y+r.h);
      ctx.moveTo(r.x+r.w, r.y); ctx.lineTo(r.x, r.y+r.h);
      ctx.stroke();
      break;
    }
    case 'rock':{
      ctx.fillStyle = '#3d3d42';
      ctx.beginPath();
      ctx.moveTo(r.x, r.y+r.h);
      ctx.lineTo(r.x+3, r.y+4);
      ctx.lineTo(r.x+r.w*0.5, r.y);
      ctx.lineTo(r.x+r.w-2, r.y+6);
      ctx.lineTo(r.x+r.w, r.y+r.h);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'bat':{
      const flap = Math.sin(o.flapT/90) * 5;
      ctx.shadowColor = 'rgba(190,125,255,0.95)';
      ctx.shadowBlur = 7;
      ctx.fillStyle = '#8f5ac7';
      ctx.beginPath();
      ctx.moveTo(r.x+r.w/2, r.y+5);
      ctx.lineTo(r.x+1, r.y-flap-2);
      ctx.lineTo(r.x+5, r.y+7);
      ctx.lineTo(r.x+r.w*0.35, r.y+4);
      ctx.lineTo(r.x+r.w*0.65, r.y+4);
      ctx.lineTo(r.x+r.w-5, r.y+7);
      ctx.lineTo(r.x+r.w-1, r.y-flap-2);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#c9a7ff';
      ctx.fillRect(r.x+r.w*0.43, r.y+2, 3, 7);
      ctx.fillStyle = '#ff5b7d';
      ctx.fillRect(r.x+r.w*0.38, r.y+1, 2, 2);
      ctx.fillRect(r.x+r.w*0.60, r.y+1, 2, 2);
      break;
    }
  }
  ctx.restore();
}

/* ---- floaters ---- */
function drawFloaters(list){
  ctx.textAlign = 'center';

function runningPose(t, grounded, vy){
  const frame = Math.floor(t / 105) % 4;
  const frames = [
    {bob:0,  rot:-0.015, step:4,  armSwing:-3, squash:1.00},
    {bob:-2, rot:0.025,  step:-3, armSwing:3,  squash:0.985},
    {bob:0,  rot:-0.015, step:-4, armSwing:3,  squash:1.00},
    {bob:-2, rot:0.025,  step:3,  armSwing:-3, squash:0.985}
  ];
  if(!grounded){
    return { bob: vy < 0 ? -2 : 1, rot: vy < 0 ? -0.025 : 0.045, step:0, armSwing:0, squash:1.0, view:'run' };
  }
  return {...frames[frame], view:'run'};
}

function hitPose(){
  const t = Math.min(1, deathAnim.t/deathAnim.dur);
  return {
    bob: -Math.sin(t*Math.PI)*18 - t*18,
    rot: -0.15 + t*1.55,
    step:0,
    armSwing:0,
    squash:1.02,
    scale:1 + t*1.35,
    view:'side',
    facing:1,
    hit:true
  };
}

function dancePose(){
  if(!danceAnim) return runningPose(0,true,0);
  if(danceAnim.phase==='side'){
    const s = Math.sin(danceAnim.t/105);
    return {
      bob:-Math.abs(s)*1.4,
      rot:s*0.025,
      step:s*3,
      armSwing:s*2,
      squash:1,
      view:'side',
      dx:s*2
    };
  }
  if(danceAnim.phase==='turn'){
    const p = Math.min(1,danceAnim.t/450);
    return {
      bob:-2,
      rot:0,
      step:0,
      armSwing:0,
      squash:1,
      view:p<0.55?'side':'front',
      scale:1,
      armsUp:p>0.72
    };
  }
  const p = Math.min(1,danceAnim.t/350);
  return { bob:-2, rot:0, step:0, armSwing:0, squash:1, view:'front', scale:1.02, armsUp:p };
}

function drawRunDust(){
  if(mode!=='playing') return;
  const f = Math.floor(idleT/110)%3;
  const y = CFG.groundY-2;
  ctx.fillStyle = 'rgba(235,221,214,0.42)';
  if(f===0){ ctx.fillRect(CFG.playerX-28,y,3,2); ctx.fillRect(CFG.playerX-21,y+3,2,2); }
  if(f===1){ ctx.fillRect(CFG.playerX-25,y+2,4,2); ctx.fillRect(CFG.playerX-17,y+4,2,2); }
  if(f===2){ ctx.fillRect(CFG.playerX-31,y+1,3,2); ctx.fillRect(CFG.playerX-22,y+4,3,2); }
}

function drawParticlesWin(){
  if(!danceAnim || danceAnim.phase!=='pose') return;
  const n = 10;
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2 + danceAnim.t/300;
    const rad = 18 + (danceAnim.t%300)/300*14;
    const x = CFG.playerX + Math.cos(ang)*rad;
    const y = CFG.groundY-34 + Math.sin(ang)*rad*0.6;
    ctx.fillStyle = i%2? '#ffb52f':'#ffe06a';
    ctx.fillRect(x,y,2,2);
  }
}

function draw(){
  clear();
  ctx.save();
  if(mode==='dying' && screenShake.t < screenShake.dur){
    const p = 1 - screenShake.t/screenShake.dur;
    ctx.translate((Math.random()-0.5)*screenShake.mag*p, (Math.random()-0.5)*screenShake.mag*p);
  }
  drawBackground();

  if(mode==='playing' || mode==='dying'){
    if(run){
      for(const o of run.obstacles) drawObstacle(o);
      for(const d of run.diamondsArr) drawDiamond(d);
    }
  }

  // player
  if(mode==='menu'){
    drawDragon(CFG.playerX, CFG.groundY, runningPose(idleT, true, 0));
  }else if(mode==='playing'){
    drawDragon(CFG.playerX, CFG.groundY + player.y, runningPose(idleT, player.grounded, player.vy));
    drawRunDust();
  }else if(mode==='dying'){
    const t = Math.min(1, deathAnim.t/deathAnim.dur);
    const dx = t*150;
    const dy = -Math.sin(t*Math.PI)*36 - t*t*50;
    drawDragon(CFG.playerX+dx, CFG.groundY + player.y + dy, hitPose());
  }else if(mode==='winning'){
    drawDragon(CFG.playerX, CFG.groundY, dancePose());
    drawParticlesWin();
  }else if(mode==='result'){
    drawDragon(CFG.playerX, CFG.groundY, runningPose(idleT,true,0));
  }

  if(run) drawFloaters(run.floaters);
  ctx.restore();
}

   INIT
============================================================ */
function fitStageForMobile(){
  const stage=document.getElementById('stage');
  /* The reference uses a fixed 16:9 game viewport. On phones the viewport
     should scale to the available width, never be cropped by JS height math. */
  stage.style.width='100%';
  stage.style.height='auto';
  stage.style.aspectRatio=CFG.W+'/'+CFG.H;
  stage.style.alignSelf='stretch';
}
window.addEventListener('resize', fitStageForMobile, {passive:true});
window.addEventListener('orientationchange', ()=>setTimeout(fitStageForMobile,80), {passive:true});
fitStageForMobile();
refreshBalanceUI();
requestAnimationFrame(loop);

})();
</script>
